# The checks of CONTRIBUTING.md ("Building and checking"): the build, the tests, the text check, the
# audit, near_dups.py and the counts' limits (scripts/counts.py), cited.py (the names that module
# docstrings and roadmap card bodies cite), the corpus and the two roadmap checks, then the site's
# build and check. On pull requests that change Lean code, the corpus, the scripts or the roadmap
# (and by hand from the Actions tab). Pushes to main only rebuild the site.
name: CI

on:
  pull_request:
    paths:
      - '**.lean'
      - 'lakefile.lean'
      - 'lake-manifest.json'
      - 'lean-toolchain'
      - 'tests/**'
      - 'scripts/**.py'
      - 'roadmap/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prebuilt Mathlib files
        run: lake exe cache get

      - name: Build the library and the kernels
        run: lake build

      - name: Build the test modules
        run: lake build MojoProofTest

      - name: Run the tests
        run: lake test

      - name: The proved kernels' programs (roadmap/llvm-ir/programs.tsv) are current
        run: lake env lean --run scripts/L3Programs.lean --check

      - name: The L3 resolver's self-test
        run: lake env lean --run scripts/L3Programs.lean --self-test

      - name: No sorry, admit, native_decide, axiom, implemented_by or extern in GPUProof/ and MojoProof/
        run: "! grep -rnwE 'sorry|admit|native_decide|axiom|implemented_by|extern' GPUProof MojoProof"

      - name: Audit
        shell: bash
        run: set -o pipefail; lake env lean --run scripts/Audit.lean | tee audit.log

      - name: Near-duplicate theorems
        shell: bash
        run: set -o pipefail; python3 scripts/near_dups.py . --lib GPUProof --lib MojoProof --list 5 | tee near.log

      - name: Counts within scripts/counts.tsv
        run: python3 scripts/counts.py audit.log near.log

      - name: Names cited in docstrings and roadmap cards
        run: python3 scripts/cited.py

      - name: Corpus manifest
        run: |
          python3 scripts/corpus.py check
          python3 scripts/corpus.py check --root tests/sweep

      - name: Roadmap status is current
        run: python3 scripts/roadmap_status.py --check

      - name: The llvm-ir roadmap is what the importer generates
        run: python3 scripts/roadmap_llvm.py --check

      - name: Build and check the site
        run: |
          python3 -m pip install -r scripts/site-requirements.txt
          python3 scripts/site.py --out _site
          python3 scripts/site.py --check _site
